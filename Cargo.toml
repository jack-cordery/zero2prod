[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-session = { version = "0.11.0", features = ["redis-session-native-tls"] }
actix-web = "4.12.1"
actix-web-flash-messages = { version = "0.5.0", features = ["cookies"] }
anyhow = "1.0.101"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = "0.4.42"
claim = "0.5.0"
config = "0.15.19"
hex = "0.4.3"
htmlescape = "0.3.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
openidconnect = "4.0.1"
rand = "0.9.2"
redis = { version = "1.2.0", features = ["tokio-comp"] }
reqwest = { version = "0.12.28", features = ["cookies", "json"] }
rsa = "0.9.10"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-macros = { version = "2.6.0" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.20"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["registry", "env-filter"] }
unicode-segmentation = "1.12.0"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = {version = "1.19.0", features = ["v4", "serde"]}
validator = "0.20.0"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dev-dependencies]
fake = "4.4.0"
linkify = "0.10.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
rand = "0.9.2"
serde_json = "1.0.149"
wiremock = "0.6.5"

