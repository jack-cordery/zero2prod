<!DOCTYPE html> 
<html lang="en">
	<head>
		Login
	</head>
	<form action="/login" method="post">
		<label>
			Username
			<input
				type="text"
				placeholder= "Username"
				name="username"
			>
			</input>
		</label>
		<label>
			Password
			<input
				type="password"
				placeholder= "Password"
				name="password"
			>
			</input>
		</label>
		<button type="submit">
			Login
		</button>
	</form>
</html>
